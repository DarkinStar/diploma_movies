<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Semantic Search</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1d2229; --muted: #5f6b7a; --accent: #2f5fd6; --border: #e1e5ea; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 20px; }
    form { display: flex; gap: 8px; }
    input[type=text] { flex: 1; padding: 12px 14px; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; }
    button { padding: 12px 18px; font-size: 1rem; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { margin: 14px 0; color: var(--muted); min-height: 1.2em; }
    ol { list-style: none; padding: 0; margin: 0; }
    li { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .title { font-weight: 600; }
    .meta { color: var(--muted); font-size: .9rem; margin: 2px 0 6px; }
    .summary { font-size: .95rem; line-height: 1.4; }
    .score { float: right; font-variant-numeric: tabular-nums; color: var(--accent); }
    #judge { margin-top: 18px; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--card); display: none; }
  </style>
</head>
<body>
<main>
  <h1>Movie Semantic Search</h1>
  <p class="lead">Describe a plot in your own words. The service embeds the query and finds the closest movies among 32,000 Wikipedia plot summaries.</p>
  <form id="form">
    <input type="text" id="query" placeholder="e.g. a shark terrorizes a beach town" autofocus required>
    <button type="submit" id="btn">Search</button>
  </form>
  <div id="status"></div>
  <ol id="results"></ol>
  <div id="judge"></div>
</main>
<script>
  const form = document.getElementById('form');
  const status = document.getElementById('status');
  const list = document.getElementById('results');
  const judgeBox = document.getElementById('judge');
  const btn = document.getElementById('btn');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const query = document.getElementById('query').value.trim();
    if (!query) return;

    btn.disabled = true;
    list.innerHTML = '';
    judgeBox.style.display = 'none';
    status.textContent = 'Searching...';

    try {
      const res = await fetch('/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: query, top_k: 5 })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      status.textContent = data.results.length ? 'Top results:' : 'No results.';
      for (const movie of data.results) {
        const li = document.createElement('li');
        const year = movie.release_year ? ` (${movie.release_year})` : '';
        li.innerHTML =
          `<span class="score">${movie.similarity.toFixed(2)}</span>` +
          `<div class="title"></div><div class="meta"></div><div class="summary"></div>`;
        li.querySelector('.title').textContent = `${movie.title}${year}`;
        li.querySelector('.meta').textContent = movie.genre || '';
        li.querySelector('.summary').textContent = movie.summary || '';
        list.appendChild(li);
      }
      requestJudge(query, data.results.map(m => m.title));
    } catch (err) {
      status.textContent = `Search failed: ${err.message}`;
    } finally {
      btn.disabled = false;
    }
  });

  // Optional: LLM estimate of result relevance. Silently skipped when the server has no API key.
  async function requestJudge(query, titles) {
    if (!titles.length) return;
    try {
      const res = await fetch('/judge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, titles })
      });
      if (!res.ok) return;
      const data = await res.json();
      judgeBox.textContent = `LLM relevance estimate: ${data.estimate}`;
      judgeBox.style.display = 'block';
    } catch (_) { /* judge is optional */ }
  }
</script>
</body>
</html>
